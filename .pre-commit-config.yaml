# pre-commit-config.yaml
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.0.1
    hooks:
      # Preserve upstream OATutor JSON byte-for-byte under content-pool/
      - id: trailing-whitespace
        exclude: ^content-pool/
      - id: end-of-file-fixer
        exclude: ^content-pool/
      - id: check-yaml
      - id: check-json
        exclude: ^content-pool/
      # approved-manifest.json holds per-problem audit records (~3MB @ 2k problems)
      - id: check-added-large-files
        args: ["--maxkb=4096"]
